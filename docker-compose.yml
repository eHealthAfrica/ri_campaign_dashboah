services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "${RI_PORT:-8787}:8787"
    environment:
      # Optional. Without it, a secret is generated once and kept in the ri_state volume.
      RI_SESSION_SECRET: ${RI_SESSION_SECRET:-}
    volumes:
      # Generated by the scripts in scripts/. Not in git, so it must be supplied on the host.
      - ./data:/app/data:ro
      - ri_state:/app/state

volumes:
  ri_state:
